<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Pizza Counter</title>

    <link rel="stylesheet" href="task4.css">
    <script src="lab4-task4.js" defer></script>
</head>
<body>
    <main class="counter-card">
        <div class="decorative-icon" aria-hidden="true">♡</div>

        <p class="eyebrow">A LITTLE PIZZA MAGIC</p>
        <h1 id="title">Pizza Counter</h1>

        <p class="intro">
            Keep track of your pizza, one slice at a time.
        </p>

        <div class="count-panel">
            <span class="count-label">PIZZAS COUNTED</span>

            <p class="count-number">
                <span id="count">0</span>
            </p>

            <span class="count-caption">made with love ♡</span>
        </div>

        <div class="button-group">
            <button id="addBtn" class="button button-primary" type="button">
                ＋ Add pizza
            </button>

            <button id="minusBtn" class="button button-secondary" type="button">
                − Remove pizza
            </button>

            <button id="resetBtn" class="button button-reset" type="button">
                Reset counter ↻
            </button>
        </div>

        <p id="message" class="message" role="status" aria-live="polite"></p>

        <p class="footer-note">
            A little lavender, a little love <span aria-hidden="true">✿</span>
        </p>
    </main>
</body>
</html>
