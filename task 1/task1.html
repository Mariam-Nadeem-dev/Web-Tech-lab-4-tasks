<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tip and Split Calculator</title>
    <link rel="stylesheet" href="task1.css">
    <script src="task1.js" defer></script>
</head>
<body>
    <main class="calculator">
        <h1>Tip & Split Calculator</h1>
        <p class="subtitle">Calculate your bill, tip, and share.</p>

        <label for="bill">Total bill (Rs)</label>
        <input type="number" id="bill" min="0.01" step="0.01" placeholder="e.g. 3000">

        <label for="percent">Tip percentage (%)</label>
        <input type="number" id="percent" min="0" step="1" value="10">

        <label for="people">Number of people</label>
        <input type="number" id="people" min="1" step="1" value="3">

        <button id="calculateBtn">Calculate Bill</button>

        <section id="results" aria-live="polite" hidden>
            <h2>Your Results</h2>
            <p>Tip amount: <strong id="tipResult"></strong></p>
            <p>Total bill with tip: <strong id="totalResult"></strong></p>
            <p>Each person pays: <strong id="splitResult"></strong></p>
            <p>Tip rating: <strong id="ratingResult"></strong></p>
            <p id="message"></p>
        </section>
    </main>
</body>
</html>
